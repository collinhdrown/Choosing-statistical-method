<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatTest Matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand">
    <h1>StatTest Matcher</h1>
    <p id="tagline">Answer one question at a time, or describe your study in words. Every answer knocks out the tests that no longer fit.</p>
  </div>
  <div class="right-head">
    <div class="stat" id="stat"><span class="k">Possible matches</span><span class="v" id="count">&nbsp;</span></div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#" class="tab" data-tab="match">Find a test</a>
    <a href="#explore" class="tab" data-tab="explore">Explore tests</a>
  </nav>
</header>

<div class="app" id="view-match">
  <section class="left">
    <form class="card describe" id="chat-form">
      <label class="label" for="desc">Describe your study</label>
      <div class="transcript" id="transcript" aria-live="polite"></div>
      <textarea id="desc" placeholder="e.g. I measured anxiety in the same 30 students before and after a mindfulness course. The scores are skewed."></textarea>
      <div class="bar">
        <button class="btn primary" id="send" type="submit">Send</button>
      </div>
    </form>

    <div class="card answers">
      <span class="label">Your answers</span>
      <div class="path" id="path"></div>
    </div>

    <div id="stage"></div>

    <button class="btn reset" id="reset" type="button">Start over</button>
  </section>

  <section class="card field" aria-label="Possible matches">
    <span class="label">Possible Matches</span>
    <div id="svgwrap"></div>
    <div class="tray">
      <span class="label" id="traylabel">Ruled out</span>
      <div class="list" id="tray"></div>
    </div>
  </section>
</div>

<main class="explore" id="view-explore" hidden>
  <div class="picker" id="picker">
    <button class="btn pick" id="pick" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
      <span id="picklabel">Choose a test</span><span class="caret" aria-hidden="true">▾</span>
    </button>
    <div class="menu" id="menu" role="menu" hidden></div>
  </div>
  <div id="xpage"></div>
</main>
</div>

<div class="testcard" id="card" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/explore.js"></script>
</body>
</html>
